apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: house-price-ingress
  namespace: ml-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ml-platform.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: house-price-api-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: house-price-streamlit-service
            port:
              number: 8501
